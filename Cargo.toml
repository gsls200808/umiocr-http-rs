[package]
name = "umiocr-http-rs"
version = "0.1.0"
edition = "2021"
description = "Umi-OCR 兼容 HTTP API（Rust + ONNX Runtime 动态库）"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }
qrcode = { version = "0.14", default-features = false }
rqrr = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace]
members = ["tools/unpack7z"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
